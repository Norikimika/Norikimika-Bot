name: build

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            android: false
            bin: target/release/Norikimika-Bot
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            android: false
            bin: target/release/Norikimika-Bot
          # bionic build for Termux; cross-compiled, so it cannot run on the glibc runner
          - os: ubuntu-latest
            name: termux-aarch64
            android: true
            bin: target/aarch64-linux-android/release/Norikimika-Bot
    runs-on: ${{ matrix.os }}
    env:
      OPUS_VERSION: v1.5.2
      ANDROID_API: 24
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.android }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ matrix.android }}
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.name }}

      # songbird links libopus at build time; fonts/banners are compiled in from assets/
      - name: Install system deps
        if: ${{ !matrix.android }}
        run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config

      - name: Test
        if: ${{ !matrix.android }}
        run: cargo test --release --locked

      - name: Build
        if: ${{ !matrix.android }}
        run: cargo build --release --locked

      # Pin the NDK ourselves: setup-ndk@v1.6.0 resolved `r30` to the runner's preinstalled
      # 27.3, so the build was silently not using r30.
      - name: Install NDK r30
        if: ${{ matrix.android }}
        run: |
          set -euo pipefail
          curl -sSL https://dl.google.com/android/repository/android-ndk-r30-linux.zip -o "$RUNNER_TEMP/ndk.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r30" >> "$GITHUB_ENV"
          grep Pkg.Revision "$RUNNER_TEMP/android-ndk-r30/source.properties"

      - name: Point cargo at the NDK toolchain
        if: ${{ matrix.android }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$TOOLCHAIN/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/llvm-strip"
          } >> "$GITHUB_ENV"

      # audiopus_sys only links an existing opus, so build a static one for arm64-v8a first.
      # git clone (not the tarball) keeps opus from warning about an unknown package version,
      # and -Wno-dev hides the NDK toolchain's cmake_minimum_required deprecation spam.
      - name: Build static opus for Android
        if: ${{ matrix.android }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$OPUS_VERSION" https://github.com/xiph/opus.git
          cmake -S opus -B opus-build -Wno-dev \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="$ANDROID_API" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/opus-android" \
            -DBUILD_SHARED_LIBS=OFF \
            -DOPUS_BUILD_PROGRAMS=OFF \
            -DOPUS_BUILD_TESTING=OFF
          cmake --build opus-build -j"$(nproc)"
          cmake --install opus-build

      - name: Build for Termux
        if: ${{ matrix.android }}
        env:
          LIBOPUS_LIB_DIR: ${{ github.workspace }}/opus-android
          OPUS_STATIC: '1'
          OPUS_NO_PKG: '1'
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-linux-android
          "$STRIP" --strip-unneeded "${{ matrix.bin }}"

      - name: Publish binary to build branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-build-branch.sh "${{ matrix.bin }}" "Norikimika-Bot-${{ matrix.name }}"
