[package]
name = "Norikimika-Bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "Norikimika-Bot"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# app HTTP on latest reqwest; songbird's YoutubeDl still links 0.12, so keep a 0.12 client aliased for it
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1"
reqwest12 = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend", "voice"] }
songbird = { version = "0.6", features = ["builtin-queue"] }
# songbird 0.6 pins symphonia ^0.5 and asks for it with default-features = false, i.e. no
# decoders at all, so every stream died the moment it started. Same version, codecs on.
symphonia05 = { package = "symphonia", version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "adpcm", "flac", "ogg", "vorbis", "wav"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "fs", "sync", "io-util"] }

[dev-dependencies]
# only the stream-decode test touches symphonia directly, and 0.6 cannot unify with songbird's 0.5
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "adpcm", "flac", "ogg", "vorbis", "wav"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
