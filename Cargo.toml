[package]
name = "LogError404Bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
regex = "1"
rand = "0.10"
base64 = "0.23"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "cache", "model", "utils", "rustls_backend"] }
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "rustls", "serenity", "tungstenite", "builtin-queue"] }
resvg = "0.49"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 2
