[package]
name = "Norikimika-Bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "Norikimika-Bot"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# app HTTP on latest reqwest; songbird's YoutubeDl still links 0.12, so keep a 0.12 client aliased for it
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1"
reqwest12 = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend", "voice"] }
songbird = { version = "0.6", features = ["builtin-queue"] }
# songbird pulls symphonia with default-features = false, i.e. zero decoders, so every
# stream died the moment it started. Opus/webm is not decodable by symphonia 0.5 anyway,
# hence the m4a preference in the yt-dlp args next to YoutubeDl::new_ytdl_like.
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "adpcm", "flac", "ogg", "vorbis", "wav"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "fs", "sync", "io-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
